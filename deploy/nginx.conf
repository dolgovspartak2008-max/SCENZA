server {
    listen 80;
    listen [::]:80;
    server_name scenza.2.27.10.27.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/scenza/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name scenza.2.27.10.27.sslip.io;
    ssl_certificate /etc/letsencrypt/live/scenza-vps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scenza-vps/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/scenza/current/dist;
    index index.html;
    client_max_body_size 2g;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;

    location ~ ^/(api|media|downloads)(/|$) {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host 127.0.0.1:5174;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
